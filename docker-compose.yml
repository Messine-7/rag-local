name: rag-local

services:
  api:
    build: ./api
    ports:
      - "127.0.0.1:8000:8000"   # seul port publié, et seulement sur localhost (relayé par tailscale serve)
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

# Phases suivantes : db (pgvector), ollama, worker — sans "ports:", joints par leur nom de service.
