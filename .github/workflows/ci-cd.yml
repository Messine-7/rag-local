name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest

      - name: Build de l'image API
        run: docker build -t rag-api:ci ./api

  # Pas de runner self-hosted : le repo est public. La CI publie l'image testée sur ghcr.io,
  # et le PC fixe vient la chercher lui-même (deploy/pull-deploy.ps1).
  publish:
    name: Publication de l'image (ghcr.io)
    needs: ci
    # uniquement sur un push vers main, jamais sur une pull request
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Connexion à ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build et push (tags = commit et main)
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rag-local-api"
          docker build \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:main" ./api
          docker push --all-tags "$IMAGE"
