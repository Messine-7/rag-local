name: CI/CD

# Pas de runner self-hosted : le repo est public. La CI construit l'image une seule fois,
# la teste, puis publie cette même image sur ghcr.io ; le PC fixe vient la chercher
# lui-même (deploy/pull-deploy.sh).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Lint, build, tests, publication
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # utilisé uniquement par l'étape de publication, sur main
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        # version d'uv lue dans pyproject.toml (tool.uv.required-version) ;
        # Python 3.12 (.python-version) est téléchargé par uv au besoin

      - name: uv.lock à jour
        # Échoue si pyproject.toml a changé sans « uv lock » : l'image serait construite
        # avec d'anciennes versions. Correctif : uv lock, puis committer uv.lock.
        run: uv lock --locked

      - name: Lint
        # ruff à la version de uv.lock, comme sur le poste de dev
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .

      - name: Nom de l'image
        # ghcr.io impose des minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rag-local-api" >> "$GITHUB_ENV"

      - name: Build de l'image (une seule fois)
        run: |
          docker build \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -f api/Dockerfile \
            -t "$IMAGE:$GITHUB_SHA" .

      - name: Base de test (Postgres + pgvector)
        # Même image que sur le PC fixe, sur un réseau Docker partagé avec les conteneurs de test
        run: |
          docker network create ci
          docker run -d --name db --network ci \
            -e POSTGRES_USER=rag -e POSTGRES_PASSWORD=test -e POSTGRES_DB=rag_test \
            pgvector/pgvector:0.8.1-pg17
          for i in $(seq 1 30); do
            if docker exec db pg_isready -U rag -d rag_test; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Tests dans l'image
        # Conteneur jetable créé à partir de l'image : le groupe « test » de uv.lock y est
        # ajouté (pytest, httpx), l'image elle-même ne change pas.
        run: |
          docker run --rm --network ci \
            -v "$PWD/tests:/app/tests:ro" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e TEST_DATABASE_URL=postgresql://rag:test@db:5432/rag_test \
            "$IMAGE:$GITHUB_SHA" \
            uv run --frozen --no-default-groups --group test python -m pytest -p no:cacheprovider -rs tests

      - name: Test de démarrage (API et worker)
        # L'image est lancée comme en production : /health doit répondre en moins de 30 s,
        # et le worker doit être encore en marche 10 s après son démarrage.
        run: |
          docker run -d --name smoke --network ci -p 127.0.0.1:8000:8000 \
            -e DATABASE_URL=postgresql://rag:test@db:5432/rag_test \
            -e API_DB_PASSWORD=testapi \
            -e API_DATABASE_URL=postgresql://rag_api:testapi@db:5432/rag_test \
            "$IMAGE:$GITHUB_SHA"
          docker run -d --name smoke-worker --network ci \
            -e DATABASE_URL=postgresql://rag:test@db:5432/rag_test "$IMAGE:$GITHUB_SHA" python -m app.worker
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then ok=1; break; fi
            sleep 1
          done
          sleep 10
          if [ "$ok" = 1 ] && [ "$(docker inspect -f '{{.State.Running}}' smoke-worker)" = true ]; then
            exit 0
          fi
          docker logs smoke
          docker logs smoke-worker
          exit 1

      - name: Publication sur ghcr.io (tags = commit et main)
        # uniquement sur un push vers main, jamais sur une pull request
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:main"
          docker push --all-tags "$IMAGE"
