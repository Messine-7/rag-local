# Surcharge utilisée uniquement sur le PC fixe, par deploy/pull-deploy.sh et deploy/compose.sh :
# l'API et le worker tournent avec l'image construite et testée par la CI (la même pour les
# deux) ; aucune construction possible ici.
services:
  api:
    build: !reset null # efface le "build:" de docker-compose.yml (Compose 2.24 ou plus)
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER manquant}/rag-local-api:${APP_VERSION:?APP_VERSION manquant}

  worker:
    build: !reset null
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER manquant}/rag-local-api:${APP_VERSION:?APP_VERSION manquant}

  db:
    # Localhost seulement, relayé dans le tailnet par « tailscale serve » pour un client SQL
    # (DBeaver) sur le laptop, avec un compte en lecture seule (README, « Consulter la base »).
    # Vérifier que le port est libre AVANT de déployer : un port pris fait échouer le
    # déploiement et le retour arrière (sudo ss -ltnp | grep 5433).
    ports:
      - "127.0.0.1:5433:5432"

  ollama:
    # Localhost seulement, relayé dans le tailnet par « tailscale serve » pour le laptop de dev
    # (README). Ollama n'a pas d'authentification : ne jamais publier sur 0.0.0.0.
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia # GPU injecté par le NVIDIA Container Toolkit
              count: all
              capabilities: [gpu]
